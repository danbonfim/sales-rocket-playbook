<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Rocket | Ultra Playbook & Content Generator v5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00B4FF;
            --bg: #0B0D11;
            --card-bg: #161B22;
            --text: #E6EDF3;
            --text-muted: #8B949E;
            --border: #30363D;
            --cyan-gradient: linear-gradient(90deg, #00B4FF 0%, #0082FF 100%);
            --glow: 0 0 20px rgba(0, 180, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 45px;
            width: auto;
        }

        .badge {
            background: rgba(0, 180, 255, 0.1);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid rgba(0, 180, 255, 0.2);
        }

        .hero { margin-bottom: 4rem; text-align: center; }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
            font-weight: 800;
        }

        .hero h1 span {
            background: var(--cyan-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.25rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2.5rem;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: var(--primary);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 1rem;
            background: #0D1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            margin-bottom: 2rem;
            font-family: inherit;
        }

        button#gerarBtn {
            width: 100%;
            padding: 1.25rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: var(--glow);
        }

        button#gerarBtn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.5);
        }

        .output-box {
            background: #0D1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            font-size: 1rem;
            white-space: pre-wrap;
            position: relative;
            min-height: 450px;
            line-height: 1.8;
        }

        .copy-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: auto;
            padding: 0.6rem 1.2rem;
            font-size: 0.75rem;
            background: #00B4FF;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .benefit-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .strategy-card {
            background: #0D1117;
            border-top: 2px solid var(--primary);
            padding: 1.5rem;
            border-radius: 12px;
            height: 100%;
            transition: transform 0.3s;
        }

        .strategy-card:hover { transform: translateY(-5px); }

        .strategy-card h3 {
            color: var(--primary);
            font-size: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
        }

        .strategy-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @media (max-width: 1100px) {
            .benefit-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 700px) {
            .benefit-grid { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="https://lh3.googleusercontent.com/d/1500WVvVXfU5Fbvpo_i3Z3_5gXz3YpIDs" alt="Sales Rocket Logo" class="logo-img">
                <span class="badge">v5.0 Ultra</span>
            </div>
        </header>

        <section class="hero">
            <h1>Engine de <span>Conteúdo Infinito</span></h1>
            <p>Gere posts de alta conversão para os 4 perfis da Sales Rocket focados em Lead Magnets e Geração de Demanda.</p>
        </section>

        <div class="grid">
            <div class="card">
                <h2>⚙️ Configuração</h2>
                
                <label>Perfil de Saída</label>
                <select id="perfil">
                    <option value="gabriel">Gabriel (Sales Ops & SDRs)</option>
                    <option value="enrico">Enrico (Talent & Recruitment)</option>
                    <option value="thiago">Thiago (Tech & Automation)</option>
                    <option value="danilo">Danilo Bonfim (GTM & Strategy)</option>
                </select>

                <label>Produto Foco</label>
                <select id="produto">
                    <option value="sales-rocket">Sales Rocket (GTM & Vendas)</option>
                    <option value="talent-rocket">Talent Rocket (Recrutamento)</option>
                    <option value="tech-rocket">Tech Rocket (CRM & Tech)</option>
                </select>

                <label>Tipo de Gancho</label>
                <select id="tipo">
                    <option value="lead-magnet">Lead Magnet (Isca Digital)</option>
                    <option value="pain">Ataque à Dor (Provocação)</option>
                    <option value="case">Storytelling (Case de Sucesso)</option>
                </select>

                <label>Tema Central</label>
                <input type="text" id="tema" placeholder="Ex: Lead Scoring, Cold Calling...">

                <label>Palavra-chave CTA</label>
                <input type="text" id="cta" placeholder="Ex: EU QUERO, PLAYBOOK, GUIA...">

                <button id="gerarBtn">GERAR CONTEÚDO AGORA</button>
            </div>

            <div class="output-section">
                <div class="output-box" id="postOutput">Configure ao lado e clique em Gerar para ver a mágica...</div>
                <div class="stats" id="charStats">Caracteres: 0 | Tempo de leitura: 0s | Status: AGUARDANDO</div>
            </div>
        </div>
    </div>

    <script>
        const perfilData = {
            gabriel: { autor: "Gabriel", voz: "Operacional e Direta", foco: "Sales Ops & SDRs", hashtag: "#SalesOps" },
            enrico: { autor: "Enrico", voz: "Humana e Analítica", foco: "Recrutamento B2B", hashtag: "#TalentAcquisition" },
            thiago: { autor: "Thiago", voz: "Técnica e Inovadora", foco: "Tech & Automação", hashtag: "#SalesTech" },
            danilo: { autor: "Danilo Bonfim", voz: "Estratégica e Visionária", foco: "GTM & Arquitetura", hashtag: "#GrowthStrategy" }
        };

        const produtoData = {
            'sales-rocket': { nome: "Sales Rocket", entrega: "Arquitetura de Receita", promessa: "escala previsível" },
            'talent-rocket': { nome: "Talent Rocket", entrega: "Hunting de Especialistas", promessa: "time de elite" },
            'tech-rocket': { nome: "Tech Rocket", entrega: "Setup de CRM & Stack", promessa: "eficiência total" }
        };

        const lib = {
            hooks: [
                (p, pr, t) => `O LinkedIn virou um oceano de posts genéricos. Mas quem domina ${t} está jogando outro jogo. 🌊`,
                (p, pr, t) => `Pare de postar por postar. Se você quer gerar agendamentos com ${t}, precisa de uma Isca Digital impossível de ignorar.`,
                (p, pr, t) => `A verdade sobre ${t}: ou você tem um processo, ou você tem um hobby caro. 💸`,
                (p, pr, t) => `Como saímos do zero para 10+ reuniões semanais focando apenas em ${t}.`,
                (p, pr, t) => `O erro nº 1 que destrói a conversão de ${t} em operações B2B.`
            ],
            bodies: [
                (p, pr, t) => `Na ${pr.nome}, validamos que o segredo não é o volume, mas a relevância. No foco de ${p.foco}, a clareza vence o ruído.`,
                (p, pr, t) => `Nós construímos a ${pr.entrega} baseada em dados reais. Para ${t}, aplicamos o framework de 'Micro-Sims' que acelera o pipeline.`,
                (p, pr, t) => `O mercado brasileiro amadureceu. Hoje, para vender ${pr.nome}, você precisa educar antes de prospectar.`,
                (p, pr, t) => `Imagine ter um motor de demanda onde ${t} é o combustível principal para atingir a ${pr.promessa}.`
            ],
            magnets: [
                (p, pr, t) => `Construí um material completo: 'O Mapa da Mina de ${t}'.

Lá eu mostro:
✅ O workflow exato que usamos na ${pr.nome}
✅ Templates de mensagens de alta conversão
✅ Checklist de setup para ${p.foco}`,
                (p, pr, t) => `Liberei meu Playbook interno de ${t}. É o mesmo que usamos para garantir a ${pr.promessa} dos nossos clientes.`,
                (p, pr, t) => `Desenvolvi uma Calculadora de ROI para ${t}. Chega de chutar números na hora de apresentar para o board.`
            ],
            ctas: [
                (p, pr, t, k) => `Quer acesso a esse material de ${t}? Comenta "${k}" abaixo e eu te envio agora no inbox. 🚀`,
                (p, pr, t, k) => `Vou liberar apenas 20 acessos para o guia de ${t}. Digite "${k}" para garantir o seu.`,
                (p, pr, t, k) => `Não perca mais tempo tentando adivinhar. Escreva "${k}" aqui embaixo e receba o playbook de ${pr.entrega}.`
            ]
        };

        document.getElementById('gerarBtn').onclick = () => {
            const perf = perfilData[document.getElementById('perfil').value];
            const prod = produtoData[document.getElementById('produto').value];
            const tema = document.getElementById('tema').value || 'Performance B2B';
            const key = document.getElementById('cta').value || 'EU QUERO';
            
            const hook = lib.hooks[Math.floor(Math.random() * lib.hooks.length)](perf, prod, tema);
            const body = lib.bodies[Math.floor(Math.random() * lib.bodies.length)](perf, prod, tema);
            const magnet = lib.magnets[Math.floor(Math.random() * lib.magnets.length)](perf, prod, tema);
            const cta = lib.ctas[Math.floor(Math.random() * lib.ctas.length)](perf, prod, tema, key);

            let content = `${hook}

${body}

${magnet}

${cta}

${perf.hashtag} #SalesRocket #GTM #B2B`;
            
            document.getElementById('postOutput').innerHTML = content + '<button class="copy-btn" id="copyPost">COPIAR POST</button>';
            
            const count = content.length;
            document.getElementById('charStats').textContent = `Caracteres: ${count} | Tempo de leitura: ~${Math.round(count/20)}s | Status: OTIMIZADO`;
            
            document.getElementById('copyPost').onclick = () => {
                const text = document.getElementById('postOutput').innerText.replace('COPIAR POST', '').trim();
                navigator.clipboard.writeText(text).then(() => {
                    document.getElementById('copyPost').textContent = 'COPIADO!';
                    setTimeout(() => document.getElementById('copyPost').textContent = 'COPIAR POST', 2000);
                });
            };
        };
    </script>
</body>
</html>
