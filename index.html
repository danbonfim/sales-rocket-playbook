<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Rocket | Ultra Playbook & Content Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5C00;
            --bg: #0B0D11;
            --card-bg: #161B22;
            --text: #E6EDF3;
            --text-muted: #8B949E;
            --border: #30363D;
            --accent: #1F6FEB;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span { color: white; }

        .badge {
            background: rgba(255, 92, 0, 0.1);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--primary);
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .nav-tab {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
            color: var(--text-muted);
            font-weight: 600;
        }

        .nav-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .section-content { display: none; animation: fadeIn 0.5s ease; }
        .section-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: 0.3s;
        }

        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .card h3 { color: var(--primary); margin-bottom: 1rem; font-size: 1.25rem; }
        .card p { color: var(--text-muted); font-size: 0.95rem; }

        .generator-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }

        select, input, textarea {
            width: 100%;
            background: #0D1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            color: white;
            font-family: inherit;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover { background: #E65300; }

        .output-area {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            position: sticky;
            top: 2rem;
        }

        .output-box {
            background: #0D1117;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            white-space: pre-wrap;
            font-size: 0.9rem;
            min-height: 100px;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--border);
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🚀 Sales <span>Rocket</span></div>
        <div class="badge">Ultra Playbook v2.1</div>
    </header>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="showSection('playbook')">Ultra Playbook</div>
        <div class="nav-tab" onclick="showSection('generator')">Gerador de Conteúdo</div>
    </div>

    <div id="playbook" class="section-content active">
        <div class="grid-3">
            <div class="card"><h3>Gabriel Dias</h3><p>O Estrategista comercial.</p></div>
            <div class="card"><h3>Enrico Bianchi</h3><p>O Operador comercial.</p></div>
            <div class="card"><h3>Thiago Hortolan</h3><p>O Gerador de Demanda.</p></div>
        </div>
    </div>

    <div id="generator" class="section-content">
        <div class="generator-layout">
            <div class="form-panel">
                <div class="form-group">
                    <label>Perfil do Autor</label>
                    <select id="perfil">
                        <option value="gabriel">Gabriel Dias</option>
                        <option value="enrico">Enrico Bianchi</option>
                        <option value="thiago">Thiago Hortolan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de Post</label>
                    <select id="tipo">
                        <option value="storytelling">Storytelling</option>
                        <option value="lista">Lista</option>
                        <option value="how-to">How-to</option>
                        <option value="antes-depois">Antes/Depois</option>
                        <option value="decisao">Decisão</option>
                        <option value="hack">Hack</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tema</label>
                    <input type="text" id="tema">
                </div>
                <div class="form-group">
                    <label>Keyword CTA</label>
                    <select id="cta">
                        <option value="CASE">CASE</option>
                        <option value="PROCESSO">PROCESSO</option>
                        <option value="SDR">SDR</option>
                    </select>
                </div>
                <button class="btn" id="gerarBtn">Gerar Conteúdo</button>
            </div>

            <div class="output-area">
                <label>LinkedIn Post</label>
                <div class="output-box" id="postOutput">...<button class="copy-btn" id="copyPost">Copiar</button></div>
                <label>Image Prompt</label>
                <div class="output-box" id="promptOutput">...<button class="copy-btn" id="copyPrompt">Copiar</button></div>
            </div>
        </div>
    </div>
</div>

<script>
    function showSection(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    const perfilData = {
        gabriel: { nome: 'Gabriel Dias', foco: 'estratégia e visão C-level', frameworks: ['MEDDIC', 'GTM Architect'] },
        enrico: { nome: 'Enrico Bianchi', foco: 'processos e CRM', frameworks: ['Pipeline Velocity', 'CRM Ops'] },
        thiago: { nome: 'Thiago Hortolan', foco: 'demanda e outbound', frameworks: ['Social Selling', 'Outbound 2.0'] }
    };

    const templates = {
        storytelling: [
            (d, t, k) => `História real sobre ${t}.
No B2B, sem ${d.foco}, nada escala.
Implementamos ${d.frameworks[0]} e mudamos o jogo.
💬 Comenta ${k} que mando o case.`
        ],
        lista: [
            (d, t, k) => `5 erros sobre ${t}:
1. Sem processo
2. Sem ${d.foco}
3. CRM ignorado
4. GTM fraco
5. Time perdido
Quer o checklist? Comenta ${k}.`
        ],
        'how-to': [
            (d, t, k) => `Passo a passo para ${t}:
1. Diagnóstico de ${d.foco}
2. Framework ${d.frameworks[0]}
3. Execução.
Comenta ${k} para o guia.`
        ],
        'antes-depois': [
            (d, t, k) => `Cenário A: Caos em ${t}.
Cenário B: Crescimento com ${d.foco}.
A ponte foi o método Sales Rocket.
Comenta ${k}.`
        ],
        decisao: [
            (d, t, k) => `Decisão C-level sobre ${t}.
Escolher entre contratar mais gente ou arrumar ${d.foco}.
O framework ${d.frameworks[1]} ajuda aqui.
Comenta ${k}.`
        ],
        hack: [
            (d, t, k) => `Hack de 1 minuto para ${t}.
Use ${d.frameworks[0]} para destravar.
Comenta ${k} que mando o script.`
        ]
    };

    document.getElementById('gerarBtn').onclick = () => {
        const p = document.getElementById('perfil').value;
        const type = document.getElementById('tipo').value;
        const tema = document.getElementById('tema').value || 'Vendas B2B';
        const key = document.getElementById('cta').value;

        const data = perfilData[p];
        const content = templates[type][0](data, tema, key);
        
        document.getElementById('postOutput').firstChild.textContent = content;
        document.getElementById('promptOutput').firstChild.textContent = "3D isometric sales pipeline visualization, orange and navy colors, professional style --ar 16:9";
    };

    function setupCopy(btnId, outId) {
        document.getElementById(btnId).onclick = () => {
            const text = document.getElementById(outId).firstChild.textContent;
            navigator.clipboard.writeText(text).then(() => alert('Copiado!'));
        };
    }
    setupCopy('copyPost', 'postOutput');
    setupCopy('copyPrompt', 'promptOutput');
</script>
</body>
</html>
